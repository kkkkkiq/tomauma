<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vast+Shadow&display=swap" rel="stylesheet">
    <title>Tomar uma</title>
</head>
    
<body>
    <main>
        <section >
            <div class="container telasop justify-content-center align-items-center vh-100 px-2" id="per">
                <div class="row">
                    <div class="col-md-12">
                        <div class=" fundo text-center">
                        <div>
                        <h1 class="texto">Bora toma uma?</h1>
                        <button class="botoes" id="nao">Não</button>
                        <button class="botoes" id="sim">Sim</button>
                        </div>

                        <div>
                            <img src="img/chopp.jpg" alt="sim" width="250px" height="250px" class="espaço">
                        </div>
                        </div>
                    </div>

                </div>

            </div>
            

        </section>

        <section>
            <div class="container telasop justify-content-center align-items-center vh-100 px-2" id="dia">
                <div class="row">
                    <div class="col-md-12 ">
                        <div class="fundo text-center">
                        <div class="campo">
                        <h2 class="texto">Qual dia?</h2>
                        <form id="formulario">
                            <label for="name"></label>
                            <input type="text" placeholder="Seu nome" id="name" class="name" required>
                            <label for="local"></label>
                            <input type="text" name="local" id="local" placeholder="aonde">
                            <input type="datetime-local" id="data" name="data" required>
                            <button type="submit" class="botoes espaço">Marcar</button>
                        </form>

                        <p id="resultado"></p>

                        </div>
                        <div>
                        <img src="img/vamo.jfif" alt="oba" width="250px" height="250px" class="espaço">
                        </div>
                        </div>

                    </div>

                </div>

            </div>
        </section>

        <section>
            <div class="container telasop justify-content-center align-items-center vh-100 px-2" id="eba">
                <div class="row">
                    <div class="col-md-12">
                        <div class="fundo text-center">

                            <div>
                                <h2 class="texto">Eba</h2>
                            </div>

                            <div>
                                <img src="img/oba.jfif" alt="show" width="250px" height="250px" class="espaço">
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script type="module" src="./script.js"></script>

</body>
</html>
